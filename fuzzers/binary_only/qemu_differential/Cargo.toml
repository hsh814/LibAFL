[package]
name = "qemu_differential"
version = "0.16.0"
authors = [
  "Seungheon Han <shhan@unist.ac.kr>"
]
edition = "2021"

[features]
default = ["std"]
std = []
x86_64 = ["libafl_qemu/x86_64"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[dependencies]
clap = { version = "4.5.18", features = ["derive", "string"] }
env_logger = { version = "0.11.5" }
libafl = { path = "../../../crates/libafl" }
libafl_bolts = { path = "../../../crates/libafl_bolts", features = ["errors_backtrace"] }
libafl_qemu = { path = "../../../crates/libafl_qemu", features = ["usermode", "x86_64"] }
log = { version = "0.4.22", features = ["release_max_level_info"] }
mimalloc = "0.1.48"
